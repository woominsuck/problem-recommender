<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 — 문제 은행 추천 엔진</title>
<meta name="theme-color" content="#1B2A38">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#EDF0F3; color:#1B2A38; text-align:center; padding:24px;
    font-family:'IBM Plex Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;
    word-break:keep-all;
  }
  .box{max-width:26em}
  .code{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:52px; font-weight:600; color:#1F5FA8; line-height:1; margin-bottom:14px;
  }
  h1{font-size:20px; font-weight:600; margin:0 0 10px}
  p{font-size:15px; line-height:1.65; color:#4A5C6C; margin:0 0 24px}
  a{
    display:inline-block; background:#1B2A38; color:#F7F9FA; text-decoration:none;
    padding:11px 22px; border-radius:2px; font-size:14px; font-weight:500;
  }
  a:hover{background:#1F5FA8}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소를 잘못 입력했거나 없는 페이지입니다. 첫 화면에서 다시 시작해 주세요.</p>
    <a href="./">추천 시작 화면으로</a>
  </div>
</body>
</html>
